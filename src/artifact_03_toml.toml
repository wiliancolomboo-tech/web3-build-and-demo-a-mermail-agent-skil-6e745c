[package]
name = "mermail-core"
version = "0.1.0"
description = "Solana Mermail Attestation and Agent Messaging Anchor Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mermail_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "1.18.26"