[package]
name = "mermail-skill"
version = "0.1.0"
description = "Verifiable Agent Mailbox and Action Relay Protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mermail_skill"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["token"] }
solana-program = "=1.17.17"