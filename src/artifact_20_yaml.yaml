version: "3.8"

services:
  mermail-relay-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mermail-relay-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ENTERPRISE_ALERT_EMAIL=${ENTERPRISE_ALERT_EMAIL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - AGENT_KEYPAIR_PATH=/secrets/agent-keypair.json
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3