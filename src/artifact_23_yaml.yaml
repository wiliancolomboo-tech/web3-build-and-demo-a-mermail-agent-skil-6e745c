version: "3.8"

services:
  mermail-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mermail-autonomous-daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - PROGRAM_ID=${PROGRAM_ID}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDER_EMAIL_DOMAIN=${SENDER_EMAIL_DOMAIN}
      - RELAYER_KEYPAIR_PATH=/app/secrets/relayer-keypair.json
      - PORT=8080
    volumes:
      - ./secrets:/app/secrets:rw
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"