version: '3.8'

services:
  mermail-agent-skill:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mermail-agent-skill
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - MERMAIL_PROGRAM_ID=MermA1L111111111111111111111111111111111111
      - MERMAIL_AGENT_PRIVATE_KEY=${MERMAIL_AGENT_PRIVATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MERMAIL_SENDER=notifications@verified.mermail.network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"