[package]
name = "mermail-agent-skill"
version = "0.1.0"
description = "Enterprise Mermail Agent Skill on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mermail_agent_skill"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi-export = ["cpi"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "=1.18.26"